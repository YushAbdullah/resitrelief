<title>Resit Relief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F3FAF1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Urbanist:wght@600;700;800&display=swap">
<style>
/* Layout: airy fintech landing-style app. A soft mint wash behind a centred 1120px frame;
   desktop gets a top nav and a two-column hero, phones stack to one column with a floating
   bottom bar. Frosted white cards, floating tilted stat chips, thin green line doodles.
   See DESIGN.md. */
:root {
  --bg: #F3FAF1;           /* page ground, faint mint */
  --wash: #DDF5D6;         /* gradient glow blobs */
  --surface: #FFFFFF;      /* solid cards, sheets */
  --glass: rgba(255,255,255,.72); /* frosted cards over the wash */
  --line: #E6EEE4;         /* hairlines */
  --track: #E3EFE0;        /* empty progress track */
  --ink: #111312;          /* headline black */
  --ink-2: #3F4541;        /* body */
  --ink-3: #8A918C;        /* captions, dates */
  --green: #8EDC86;        /* CTA fill, doodles, bars */
  --green-ink: #1F7A3E;    /* text on light, positive amounts */
  --green-deep: #2FA25A;   /* progress fill */
  --on-green: #10210F;     /* text on CTA */
  --red: #E03A3E;          /* not claimable */
  --amber: #C27A00;        /* to check */
  --doodle: #8EDC86;
  --dark-card: #1C1F1D;    /* the black card in the hero stack */
  --shadow: 0 1px 2px rgba(17,19,18,.04), 0 12px 32px rgba(46,98,52,.08);
  --shadow-lift: 0 18px 50px rgba(46,98,52,.14);
  --font-display: "Urbanist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card: 18px; --r-chip: 10px; --r-btn: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D120E; --wash: #173520; --surface: #151B17; --glass: rgba(23,30,25,.78); --line: #243027; --track: #233227;
  --ink: #F1F5F1; --ink-2: #C5CEC7; --ink-3: #87918A;
  --green: #7FD478; --green-ink: #7FD98F; --green-deep: #5BC473; --on-green: #0B1A0C;
  --red: #FF7275; --amber: #F2B54A; --doodle: #4F9B54; --dark-card: #050806;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); --shadow-lift: 0 18px 50px rgba(0,0,0,.45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0D120E; --wash: #173520; --surface: #151B17; --glass: rgba(23,30,25,.78); --line: #243027; --track: #233227;
  --ink: #F1F5F1; --ink-2: #C5CEC7; --ink-3: #87918A;
  --green: #7FD478; --green-ink: #7FD98F; --green-deep: #5BC473; --on-green: #0B1A0C;
  --red: #FF7275; --amber: #F2B54A; --doodle: #4F9B54; --dark-card: #050806;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35); --shadow-lift: 0 18px 50px rgba(0,0,0,.45); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden;
  background-image: radial-gradient(40rem 30rem at 0% 10%, var(--wash), transparent 70%), radial-gradient(36rem 28rem at 100% 55%, var(--wash), transparent 70%); background-attachment: fixed; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--green-deep); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { max-width: 1120px; margin: 0 auto; padding-block: 12px 140px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 760px; margin: 0 auto; }

/* header */
.header { display: flex; align-items: center; gap: 16px; padding: 10px 0 6px; }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font: 800 22px/1 var(--font-display); letter-spacing: -.02em; text-decoration: none; color: var(--ink); }
.mark { display: inline-flex; } .mark i { width: 18px; height: 18px; border-radius: 50%; display: block; }
.mark i:first-child { background: var(--green); } .mark i:last-child { background: var(--ink); margin-left: -7px; }
.toplinks { display: none; gap: 28px; margin: 0 auto; }
.toplinks a { color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; padding: 6px 0; border-bottom: 2px solid transparent; }
.toplinks a[aria-current="page"] { color: var(--ink); font-weight: 600; border-color: var(--green); }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.ya { position: relative; }
.ya select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px);
  border-radius: 999px; padding: 8px 30px 8px 14px; font-weight: 600; font-size: 14px; color: var(--ink); }
.ya::after { content: ""; position: absolute; right: 13px; top: 50%; margin-top: -2px; border: 4px solid transparent; border-top: 5px solid var(--ink-2); pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; position: relative; color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--green), #F6D9B8); display: grid; place-items: center; color: var(--on-green); border: 0; }
.avatar svg { width: 20px; height: 20px; }

/* hero */
.hero { display: grid; gap: 28px; padding: 26px 0 8px; position: relative; }
.hero-copy { position: relative; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; position: relative; }
.float-chip { background: var(--surface); border-radius: var(--r-chip); box-shadow: var(--shadow); padding: 8px 14px; display: inline-flex; align-items: baseline; gap: 8px; border: 0; text-align: left; }
.float-chip b { font: 800 20px/1 var(--font-display); letter-spacing: -.01em; }
.float-chip em { font-style: italic; font-size: 13px; color: var(--ink-2); }
.float-chip.warn b { color: var(--amber); }
.float-chip:nth-child(1) { transform: rotate(-4deg); } .float-chip:nth-child(2) { transform: rotate(-2deg) translateY(4px); } .float-chip:nth-child(3) { transform: rotate(-5deg); }
h1 { font: 800 clamp(40px, 9vw, 64px)/1.02 var(--font-display); letter-spacing: -.035em; margin: 0; text-wrap: balance; position: relative; }
h1 .swash { position: relative; white-space: nowrap; }
h1 .swash::after { content: ""; position: absolute; left: -2%; right: -6%; bottom: -.06em; height: .32em; background: var(--surface); opacity: .9; border-radius: 40% 60% 50% 40%; z-index: -1; filter: blur(1px); }
.hero p.lede { color: var(--ink-2); max-width: 46ch; margin: 18px 0 24px; font-size: 15.5px; }
.ctas { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: var(--r-btn); padding: 12px 22px; font-weight: 600; font-size: 15px; background: var(--green); color: var(--on-green); transition: transform .15s, box-shadow .15s; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(76,170,82,.28); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.btn.danger { background: color-mix(in srgb, var(--red) 12%, var(--surface)); color: var(--red); }
.btn.block { width: 100%; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button.link { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--green); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.doodle { position: absolute; pointer-events: none; color: var(--doodle); fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.d-arrow { width: 140px; top: -14px; left: 230px; display: none; }
.d-squiggle { width: 130px; bottom: -30px; left: 40%; }

/* hero visual: stacked receipt cards */
.visual { position: relative; height: 300px; min-width: 0; }
.vcard { position: absolute; border-radius: 20px; box-shadow: var(--shadow-lift); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
.vcard .vb { display: flex; align-items: center; gap: 6px; font: 700 14px var(--font-display); }
.vcard .vb .mark i { width: 11px; height: 11px; } .vcard .vb .mark i:last-child { margin-left: -4px; }
.vcard small { font-size: 11px; opacity: .7; } .vcard strong { font: 700 17px/1.2 var(--font-display); }
.v-dark { width: 52%; height: 70%; left: 4%; bottom: 0; background: var(--dark-card); color: #F1F5F1; transform: rotate(-24deg); transform-origin: bottom left; }
.v-dark .vb .mark i:last-child { background: #F1F5F1; }
.v-mint { width: 50%; height: 66%; right: 2%; bottom: 4%; background: linear-gradient(160deg, #F5FCF2, #DDF3D5); color: #111312; transform: rotate(22deg); }
.v-glass { width: 52%; height: 92%; left: 50%; top: 0; transform: translateX(-46%); background: rgba(255,255,255,.82); backdrop-filter: blur(14px); color: #111312; border: 1px solid rgba(255,255,255,.9); z-index: 2; }
.v-glass .lines { display: grid; gap: 7px; margin: 10px 0; }
.v-glass .lines i { height: 6px; border-radius: 9px; background: #E3EFE0; display: block; }
.v-glass .lines i:nth-child(2) { width: 70%; } .v-glass .lines i:nth-child(3) { width: 85%; } .v-glass .lines i:nth-child(4) { width: 55%; }
.v-glass .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed #CFDCCB; padding-top: 10px; }
.v-glass .stamp { align-self: flex-start; font-size: 11px; font-weight: 700; color: #1F7A3E; background: #E4F6DF; border-radius: 6px; padding: 3px 8px; }
.fp { width: 64px; height: 64px; stroke: #8EDC86; fill: none; stroke-width: 1.6; }

/* sections */
.section { position: relative; margin-top: 56px; }
.section.glow::before { content: ""; position: absolute; inset: -40px 0 auto; height: 220px; background: radial-gradient(closest-side, var(--wash), transparent); z-index: -1; }
.section-title { text-align: center; max-width: 620px; margin: 0 auto 26px; }
.section-title h2, .page-title { font: 800 clamp(28px, 6vw, 40px)/1.1 var(--font-display); letter-spacing: -.025em; margin: 0 0 10px; text-wrap: balance; }
.section-title p, .page-sub { color: var(--ink-2); margin: 0; }
.page-title { margin-top: 26px; } .page-sub { margin-bottom: 22px; }
.banner { display: flex; gap: 12px; align-items: center; background: var(--glass); backdrop-filter: blur(10px); border: 1px dashed var(--green);
  border-radius: 14px; padding: 12px 14px; margin: 26px auto 0; max-width: 620px; font-size: 14px; color: var(--ink-2); }
.banner svg { width: 20px; height: 20px; flex: none; color: var(--green-ink); }
.banner p { margin: 0; flex: 1; min-width: 0; }

/* relief cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px;
  text-align: left; display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tile { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--green) 26%, var(--surface)); color: var(--green-ink); }
.tile svg { width: 20px; height: 20px; }
.tile.sm { width: 38px; height: 38px; } .tile.sm svg { width: 18px; height: 18px; }
.tile.lg { width: 52px; height: 52px; } .tile.lg svg { width: 24px; height: 24px; }
.tile.t-grey { background: color-mix(in srgb, var(--ink-3) 16%, var(--surface)); color: var(--ink-3); }
.pct { font-size: 12px; font-weight: 600; color: var(--green-ink); }
.card .name { color: var(--ink-2); margin-top: 14px; font-size: 14px; line-height: 1.3; min-height: 2.6em; }
.card .amt { font: 800 24px/1.15 var(--font-display); margin-top: 2px; letter-spacing: -.02em; }
.bar { height: 6px; background: var(--track); border-radius: 99px; margin: 10px 0 8px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 8px; background: var(--green-deep); border-radius: 99px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.card .of { color: var(--ink-3); font-size: 13px; }
.card .rebate { color: var(--ink-3); font-size: 13px; margin-top: 10px; }

/* feature pair: receipts list + auto import */
.pair { display: grid; gap: 16px; }
.panel { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: var(--r-card); padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; box-shadow: var(--shadow); min-width: 0; position: relative; overflow: hidden; }
.panel + .panel { margin-top: 14px; }
.pair .panel + .panel { margin-top: 0; }
.panel h3 { margin: 0; font: 700 17px/1.3 var(--font-display); }
.panel p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.panel .head { display: flex; gap: 12px; align-items: center; }
.panel .head > div { flex: 1; min-width: 0; }
.panel-top { display: flex; justify-content: space-between; align-items: center; }
.panel-top h3 { font: 600 15px var(--font-body); }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; font-size: 14px; }
.check svg { width: 20px; height: 20px; color: var(--green-deep); flex: none; }
.check small { display: block; color: var(--ink-3); font-weight: 400; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { background: var(--surface); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
.mini small { color: var(--ink-3); font-size: 12px; display: block; } .mini b { font: 700 16px var(--font-display); }
.d-blob { width: 90px; right: 14px; top: 12px; stroke-width: 1.6; }

/* receipt rows (transaction list) */
.list { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--surface); padding: 10px 12px; text-align: left;
  border-radius: 12px; box-shadow: var(--shadow); min-width: 0; transition: transform .15s; }
.row:hover { transform: translateX(2px); }
.list.tilt .row:nth-child(odd) { transform: rotate(-1deg); } .list.tilt .row:nth-child(even) { transform: rotate(.6deg); }
.row .mid { flex: 1; min-width: 0; }
.row .mid b { display: block; font-weight: 700; font-family: var(--font-display); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mid small { color: var(--ink-3); font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { text-align: right; flex: none; display: grid; gap: 1px; justify-items: end; }
.row .right b { font-weight: 700; font-size: 14.5px; }
.row .right small { font-size: 11.5px; color: var(--ink-3); }
.amt-ok { color: var(--green-ink); } .amt-bad { color: var(--red); } .amt-warn { color: var(--amber); }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.ok { background: color-mix(in srgb, var(--green) 22%, var(--surface)); color: var(--green-ink); }
.chip.warn { background: color-mix(in srgb, var(--amber) 14%, var(--surface)); color: var(--amber); }
.chip.bad { background: color-mix(in srgb, var(--red) 12%, var(--surface)); color: var(--red); }
.chip.info { background: color-mix(in srgb, var(--green) 22%, var(--surface)); color: var(--green-ink); }
.chip.ex { background: var(--track); color: var(--ink-3); }
.month { color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin: 22px 4px 10px; }
.empty { text-align: center; color: var(--ink-3); padding: 40px 20px; background: var(--glass); border: 1px dashed var(--green); border-radius: var(--r-card); }

/* claims filters */
.seg { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; white-space: nowrap; color: var(--ink-2); font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.search { width: 100%; margin-top: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 16px; }

/* forms, guide */
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--bg); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
.toggle input { width: 46px; height: 28px; appearance: none; -webkit-appearance: none; background: var(--track); border-radius: 99px; position: relative; transition: background .2s; flex: none; }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle input:checked { background: var(--green-deep); } .toggle input:checked::after { transform: translateX(18px); }
details.guide { border-top: 1px solid var(--line); }
details.guide:first-of-type { border-top: 0; }
details.guide summary { list-style: none; display: flex; gap: 12px; align-items: center; padding: 10px 0; cursor: pointer; }
details.guide summary::-webkit-details-marker { display: none; }
details.guide summary span:not(.tile) { flex: 1; font-weight: 600; }
details.guide summary em { font-style: normal; color: var(--ink-3); font-size: 14px; }
details.guide div { padding: 0 0 14px 50px; color: var(--ink-2); font-size: 14px; display: grid; gap: 6px; }
label.f { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-weight: 400; font-size: 16px; width: 100%; min-width: 0; }
.f textarea { min-height: 150px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
.form { display: grid; gap: 14px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.suggest { border-radius: 12px; padding: 12px 14px; background: color-mix(in srgb, var(--green) 16%, var(--surface)); color: var(--ink-2); font-size: 14px; display: grid; gap: 6px; }
.suggest b { color: var(--ink); }
.conf { height: 6px; border-radius: 9px; background: var(--track); overflow: hidden; } .conf i { display: block; height: 100%; background: var(--green-deep); }
.preview { width: 100%; max-height: 280px; object-fit: contain; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
.rawtext { max-height: 200px; overflow: auto; white-space: pre-wrap; }
.progress { display: grid; gap: 10px; text-align: center; padding: 20px 0; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14.5px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; text-align: right; font-weight: 500; overflow-wrap: anywhere; }
.subbars { display: grid; gap: 12px; }
.subbars .top { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-2); gap: 8px; }
.subbars .bar { margin: 6px 0 0; }

/* bottom bar (phones) */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-inner { pointer-events: auto; max-width: 520px; margin: 0 auto; background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: var(--shadow-lift); display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) 76px minmax(0,1fr) minmax(0,1fr); align-items: center; padding: 6px; position: relative; }
.nav a { display: grid; justify-items: center; gap: 2px; padding: 7px 2px; border-radius: 16px; color: var(--ink-3); text-decoration: none; font-size: 12px; font-weight: 500; white-space: nowrap; min-width: 0; }
.nav a svg { width: 23px; height: 23px; }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav a[aria-current="page"] svg { color: var(--green-deep); }
.fab { position: absolute; left: 50%; top: -22px; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 20px; border: 0;
  background: var(--green); color: var(--on-green); display: grid; place-items: center; box-shadow: 0 12px 26px rgba(76,170,82,.4); }
.fab svg { width: 28px; height: 28px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(13,18,14,.4); backdrop-filter: blur(3px); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s ease; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); animation: up .25s cubic-bezier(.2,.8,.2,1); }
.sheet > * { min-width: 0; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--track); margin: 0 auto 14px; }
